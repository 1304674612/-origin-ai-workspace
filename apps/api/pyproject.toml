[project]
name = "origin-ai-api"
version = "0.4.1"
description = "FastAPI backend for ORIGIN AI Workspace"
requires-python = ">=3.11,<3.15"
dependencies = [
  "alembic>=1.15.2",
  "asyncpg>=0.30.0",
  "bcrypt>=4.3.0,<5.0.0",
  "beautifulsoup4>=4.12.3",
  "cryptography>=42.0.0",
  "email-validator>=2.2.0",
  "fastapi>=0.115.12",
  "greenlet>=3.2.1",
  "httpx>=0.28.1",
  "openai>=1.78.1",
  "passlib[bcrypt]>=1.7.4",
  "pydantic-settings>=2.9.1",
  "pydantic>=2.11.4",
  "python-docx>=1.1.2",
  "python-jose[cryptography]>=3.4.0",
  "python-multipart>=0.0.20",
  "pillow>=11.0.0",
  "pgvector>=0.4.0",
  "pypdf>=5.4.0",
  "pytesseract>=0.3.13",
  "redis>=5.2.1",
  "sqlalchemy[asyncio]>=2.0.40",
  "tiktoken>=0.13.0",
  "structlog>=25.3.0",
  "tenacity>=9.1.2",
  "uvicorn[standard]>=0.34.2",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.21.0",
  "debugpy>=1.8.0",
  "httpx>=0.28.1",
  "mypy>=1.15.0",
  "pytest>=8.3.5",
  "pytest-asyncio>=0.26.0",
  "pytest-cov>=6.1.1",
  "ruff>=0.11.9",
  "sqlalchemy2-stubs>=0.0.2a38",
  "types-passlib>=1.7.7",
  "types-python-jose>=3.3.0",
  "types-redis>=4.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
no_implicit_optional = true
check_untyped_defs = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
ignore_missing_imports = true
exclude = ["alembic/", "tests/"]

[[tool.mypy.overrides]]
module = [
  "passlib.*", "jose.*", "tiktoken.*", "pytesseract.*", "PIL.*", "pgvector.*",
]
ignore_missing_imports = true

# SQLAlchemy 2.0 ORM descriptors (Mapped, mapped_column, relationship) are not
# recognised by the stock type stubs. Ignore errors in model/repo layers until
# sqlalchemy ships its own py.typed marker.
[[tool.mypy.overrides]]
module = [
  "app.models.*",
  "app.repositories.*",
  "app.core.database",
  "app.middleware.*",
  "app.services.ai.*",
  "app.services.files.*",
  "app.services.rag.*",
]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
