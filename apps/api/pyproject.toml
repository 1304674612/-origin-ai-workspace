[project]
name = "origin-ai-api"
version = "0.1.0"
description = "FastAPI backend for ORIGIN AI Workspace"
requires-python = ">=3.11,<3.15"
dependencies = [
  "alembic>=1.15.2",
  "asyncpg>=0.30.0",
  "bcrypt>=4.3.0",
  "email-validator>=2.2.0",
  "fastapi>=0.115.12",
  "greenlet>=3.2.1",
  "httpx>=0.28.1",
  "openai>=1.78.1",
  "passlib[bcrypt]>=1.7.4",
  "pydantic-settings>=2.9.1",
  "pydantic>=2.11.4",
  "python-docx>=1.1.2",
  "python-jose[cryptography]>=3.4.0",
  "python-multipart>=0.0.20",
  "redis>=5.2.1",
  "sqlalchemy[asyncio]>=2.0.40",
  "structlog>=25.3.0",
  "tenacity>=9.1.2",
  "uvicorn[standard]>=0.34.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.5",
  "pytest-asyncio>=0.26.0",
  "ruff>=0.11.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
