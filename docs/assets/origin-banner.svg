<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050508"/>
      <stop offset="50%" stop-color="#0a0c14"/>
      <stop offset="100%" stop-color="#050510"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orb1" cx="0.2" cy="0.3" r="0.4">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="orb2" cx="0.8" cy="0.7" r="0.35">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Ambient orbs -->
  <circle cx="200" cy="120" r="280" fill="url(#orb1)"/>
  <circle cx="950" cy="280" r="250" fill="url(#orb2)"/>

  <!-- Grid dots (subtle) -->
  <g opacity="0.04">
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="white"/>
    </pattern>
    <rect width="1200" height="400" fill="url(#grid)"/>
  </g>

  <!-- Accent line glow -->
  <rect x="310" y="165" width="580" height="1" fill="url(#accent)" opacity="0.3"/>
  <rect x="310" y="260" width="580" height="1" fill="url(#accent)" opacity="0.15"/>

  <!-- Logo mark: stylized "O" with orbiting ring -->
  <g transform="translate(130,200)">
    <circle cx="0" cy="0" r="58" stroke="url(#accent)" stroke-width="1.5" opacity="0.2"/>
    <circle cx="0" cy="0" r="48" stroke="url(#accent)" stroke-width="2" opacity="0.4"/>
    <circle cx="0" cy="0" r="42" stroke="url(#accent)" stroke-width="1" opacity="0.6" stroke-dasharray="8 4"/>
    <!-- Orbiting dot -->
    <circle cx="0" cy="-48" r="4" fill="#22d3ee" opacity="0.9">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Title -->
  <text x="290" y="225" font-family="system-ui,-apple-system,sans-serif" font-size="72" font-weight="700" letter-spacing="6" fill="white">ORIGIN</text>

  <!-- Tagline -->
  <text x="298" y="288" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="300" letter-spacing="2" fill="#94a3b8">Self-Hosted AI Workspace</text>

  <!-- Small accent bar under title -->
  <rect x="298" y="300" width="60" height="2" fill="url(#accent)"/>

  <!-- Bottom metadata -->
  <g transform="translate(298,340)" font-family="monospace" font-size="12" fill="#475569" letter-spacing="1">
    <text x="0" y="0">v0.1.0</text>
    <circle cx="55" cy="-4" r="2" fill="#334155"/>
    <text x="70" y="0">MIT</text>
    <circle cx="110" cy="-4" r="2" fill="#334155"/>
    <text x="125" y="0">Next.js 15</text>
    <circle cx="210" cy="-4" r="2" fill="#334155"/>
    <text x="225" y="0">FastAPI</text>
    <circle cx="305" cy="-4" r="2" fill="#334155"/>
    <text x="320" y="0">Docker</text>
  </g>
</svg>
