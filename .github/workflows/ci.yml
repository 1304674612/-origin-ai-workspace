name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Frontend ──────────────────────────────────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx turbo typecheck

      - name: Lint
        run: npx turbo lint

      - name: Test
        run: npx turbo test

      - name: Build
        run: npx turbo build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_API_URL: http://localhost:8000

  # ── Backend ───────────────────────────────────────────
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: origin
          POSTGRES_PASSWORD: origin_password
          POSTGRES_DB: origin_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy app/

      - name: Tests
        run: pytest tests/ -v --cov=app --cov-report=term-missing
        env:
          JWT_SECRET_KEY: ci-test-key-must-be-at-least-32-chars-long
          APP_ENCRYPTION_KEY: ci-encryption-key-at-least-32-chars

      - name: Smoke test
        run: |
          python -c "
          from app.core.config import Settings
          from app.main import app
          print('App loaded OK, routes:', len(app.routes))
          "
        env:
          JWT_SECRET_KEY: ci-test-key-must-be-at-least-32-characters
          APP_ENCRYPTION_KEY: ci-encryption-key-must-be-32-chars

  # ── Docker ────────────────────────────────────────────
  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t origin-api:ci .

      - name: Build Web image
        run: docker build -f Dockerfile.web -t origin-web:ci .
